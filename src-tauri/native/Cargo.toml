[package]
name = "chatty-native"
version = "0.1.1"
description = "chatty mit nativer Oberfläche (iced, ohne WebView), ADR 08"
edition = "2024"
license = "Apache-2.0"

[dependencies]
chatty-core = { path = "../core" }
# Software-Renderer (tiny-skia) statt wgpu: kein GPU-Treiber im Prozess, weniger Speicher.
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "x11", "wayland", "tokio", "thread-pool", "markdown", "image"] }
tokio = { version = "1.54.1", features = ["sync", "time"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
# Dateidialoge; Linux über XDG-Portal (kein GTK im Prozess).
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
notify-rust = "4.11"
opener = "0.8"
# Updater: gleiches reqwest wie der Kern, minisign wie Tauri, Austausch der laufenden Datei.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23.1"
minisign-verify = "0.3"
self-replace = "1.5"

# Installer: `cargo packager --release -p chatty-native` (deb, AppImage, NSIS, dmg je nach System).
[package.metadata.packager]
productName = "chatty-native"
identifier = "io.github.martinsachs.chatty-native"
description = "Schlanker Chatclient für Google Chat und Mattermost (native Oberfläche)"
publisher = "martinsachs"
category = "Productivity"
licenseFile = "../../LICENSE.txt"
icons = ["../icons/32x32.png", "../icons/128x128.png", "../icons/128x128@2x.png", "../icons/icon.icns", "../icons/icon.ico"]
binaries = [{ path = "chatty-native", main = true }]

[package.metadata.packager.nsis]
# Installation ohne Administratorrechte, damit sich die App selbst aktualisieren kann.
installMode = "currentUser"
