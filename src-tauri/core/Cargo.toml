[package]
name = "chatty-core"
version = "0.2.3"
description = "chatty: Backends (Google Chat, Mattermost), Cache, Konfiguration, Kontoverwaltung – ohne Oberfläche"
edition = "2024"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["sync", "time", "macros", "rt-multi-thread", "net", "io-util", "fs"] }
# TLS nur mit ring (ADR 03): Provider installiert backend::init_tls().
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider", "multipart", "http2", "query", "form"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
async-trait = "0.1.92"
thiserror = "2.0.21"
toml = "1.2.1"
dirs = "7.0.0"
futures-util = "0.3.34"
url = "2.5.9"
sha2 = "0.11.1"
base64 = "0.23.1"
rand = "0.10.4"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tempfile = "3.27.0"
