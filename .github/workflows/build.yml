name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Linux-Abhängigkeiten
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run check
      - name: Logiktest UI-Zustand
        run: node scripts/test-chat-store.mjs
      - run: npm run build

      - name: clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        working-directory: src-tauri
        run: cargo test

      # ADR 03: nur ring als Krypto-Provider.
      - name: kein aws-lc-rs
        working-directory: src-tauri
        run: "! cargo tree --target all -i aws-lc-rs >/dev/null 2>&1"
