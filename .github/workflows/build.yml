name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Linux-Abhängigkeiten
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run check
      - name: Logiktest UI-Zustand
        run: node scripts/test-chat-store.mjs
      - run: npm run build

      - name: clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        working-directory: src-tauri
        run: cargo test --workspace

      # ADR 03: nur ring als Krypto-Provider.
      - name: kein aws-lc-rs
        working-directory: src-tauri
        run: "! cargo tree --workspace --target all -i aws-lc-rs >/dev/null 2>&1"

  # Beide Varianten (Tauri und nativ) mit Installern auf allen drei Systemen; Pakete als Artefakte.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            native_formats: deb,appimage
          - platform: windows-latest
            native_formats: nsis
          - platform: macos-latest
            native_formats: app,dmg
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux-Abhängigkeiten
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev libfuse2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager

      - run: npm ci

      # Ohne Signaturschlüssel: Updater-Artefakte nur im Release-Workflow.
      - name: Tauri-Installer
        shell: bash
        run: npx tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Native Installer
        shell: bash
        working-directory: src-tauri
        run: |
          cargo build --release -p chatty-native
          cargo packager --release -p chatty-native --formats ${{ matrix.native_formats }}

      - uses: actions/upload-artifact@v4
        with:
          name: chatty-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/*.deb
            src-tauri/target/release/*.AppImage
            src-tauri/target/release/*-setup.exe
            src-tauri/target/release/*.dmg
            src-tauri/target/release/chatty-native
            src-tauri/target/release/chatty-native.exe
          if-no-files-found: error
          retention-days: 14
