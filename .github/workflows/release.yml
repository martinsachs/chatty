name: release

# Tag v* pushen → Installer beider Varianten (Tauri, nativ) für Linux, Windows, macOS + latest.json bzw.
# latest-native.json (Updater); nach allen Builds veröffentlicht.
#
# Signaturschlüssel (TAURI_SIGNING_PRIVATE_KEY) nur in den Jobs `release` und `native-sign`. Dort laufen
# außer GitHub-eigenen Actions nur die auf Commit gepinnte tauri-action; keine Caches (Cache-Poisoning aus
# anderen Läufen), Rust per vorinstalliertem rustup. Die nativen Builds laufen ohne Schlüssel, signiert wird
# danach in einem eigenen Job.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Linux-Abhängigkeiten
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          if [ "${{ matrix.platform }}" = macos-latest ]; then rustup target add aarch64-apple-darwin x86_64-apple-darwin; fi

      - run: npm ci

      # Leeres Secret führt sonst erst nach dem Build zu "Missing comment in secret key".
      - name: Signatur-Secrets prüfen
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY ist leer: als Repository-Secret unter Settings → Secrets and variables → Actions anlegen."
            exit 1
          fi
          if ! printf '%s' "$KEY" | base64 -d 2>/dev/null | head -1 | grep -q '^untrusted comment:'; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY ist nicht der Inhalt von ~/.tauri/chatty.key (eine Base64-Zeile)."
            exit 1
          fi

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: chatty ${{ github.ref_name }}
          releaseBody: Installer siehe Assets. Bestehende Installationen aktualisieren sich selbst.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # Native Variante (ADR 08): Installer und signierte Binärdatei je Plattform in den Release-Entwurf,
  # den die Tauri-Jobs angelegt haben. Die Binärdatei mit .sig dient dem Updater von chatty-native.
  native:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            key: linux-x86_64
            formats: deb,appimage
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            key: windows-x86_64
            formats: nsis
          - platform: macos-latest
            target: aarch64-apple-darwin
            key: darwin-aarch64
            formats: app,dmg
          - platform: macos-latest
            target: x86_64-apple-darwin
            key: darwin-x86_64
            formats: app,dmg
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Linux-Abhängigkeiten
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libfuse2

      - name: Rust und cargo-packager
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}
          cargo install cargo-packager --locked --version 0.11.8

      - name: Bauen und verpacken
        shell: bash
        working-directory: src-tauri
        run: |
          cargo build --release -p chatty-native --target ${{ matrix.target }}
          cargo packager --release -p chatty-native --target ${{ matrix.target }} --formats ${{ matrix.formats }}

      # Ohne Schlüssel: unsignierte Updater-Datei und Installer in den Release-Entwurf; `native-sign` signiert.
      - name: Hochladen
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUT=src-tauri/target/${{ matrix.target }}/release
          mkdir -p dist
          # Updater-Datei: Linux die AppImage, sonst die Binärdatei. Version und Plattform im Namen: der Name
          # landet signiert in der .sig, der Updater prüft ihn (Downgrade-Schutz, native/src/updater.rs).
          V="${GITHUB_REF_NAME#v}"
          case "${{ runner.os }}" in
            Linux) SRC=$(ls "$OUT"/*.AppImage); BIN="chatty-native-$V-${{ matrix.key }}.AppImage" ;;
            Windows) SRC="$OUT/chatty-native.exe"; BIN="chatty-native-$V-${{ matrix.key }}.exe" ;;
            *) SRC="$OUT/chatty-native"; BIN="chatty-native-$V-${{ matrix.key }}" ;;
          esac
          cp "$SRC" "dist/$BIN"
          for f in "$OUT"/*.deb "$OUT"/*.AppImage "$OUT"/*-setup.exe "$OUT"/*.dmg; do
            [ -f "$f" ] || continue
            case "${{ matrix.key }}" in darwin-x86_64) n="$(basename "${f%.dmg}")-x86_64.dmg"; cp "$f" "dist/$n" ;; *) cp "$f" dist/ ;; esac
          done
          ls -la dist
          gh release upload "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --clobber

  # Updater-Dateien der nativen Variante signieren (gleicher Schlüssel wie der Tauri-Updater) und
  # latest-native.json erzeugen. Nur GitHub-eigene Actions; npm ohne Install-Skripte, nur für `tauri signer`.
  native-sign:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - run: npm ci --ignore-scripts

      - name: Herunterladen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir sigs
          V="${GITHUB_REF_NAME#v}"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir sigs --pattern "chatty-native-$V-*"
          rm -f sigs/*.sig
          ls -la sigs

      - name: Signieren
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: for f in sigs/*; do npx tauri signer sign "$f"; done

      - name: latest-native.json und hochladen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          cd sigs
          python3 - <<'EOF'
          import glob, json, os
          tag, repo = os.environ["TAG"], os.environ["REPO"]
          prefix = f"chatty-native-{tag.lstrip('v')}-"
          platforms = {}
          for sig in sorted(glob.glob(prefix + "*.sig")):
              asset = sig[:-4]
              key = asset[len(prefix):].removesuffix(".exe").removesuffix(".AppImage")
              platforms[key] = {
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{asset}",
                  "signature": open(sig).read().strip(),
              }
          if len(platforms) != 4:
              raise SystemExit(f"erwartet 4 Plattformen, gefunden {sorted(platforms)}")
          json.dump({"version": tag.lstrip("v"), "platforms": platforms}, open("latest-native.json", "w"), indent=2)
          print(open("latest-native.json").read())
          EOF
          gh release upload "$TAG" *.sig latest-native.json --repo "$REPO" --clobber

  # Erst wenn alle Plattformen gebaut und hochgeladen sind: Entwurf veröffentlichen.
  # Danach findet der Updater latest.json unter releases/latest.
  publish:
    needs: [release, native-sign]
    runs-on: ubuntu-latest
    steps:
      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false --latest
